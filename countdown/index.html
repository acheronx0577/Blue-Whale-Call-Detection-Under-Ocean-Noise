<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071820">
<title>Blue Whale Call Detection — Project Countdown</title>
<style>
:root{color-scheme:dark;--text:#ecf5f4;--muted:#a6bfbe;--line:rgba(183,221,218,.2);--accent:#7dd3c7}
*{box-sizing:border-box}html,body{min-height:100%;margin:0;background:transparent}
body{display:grid;place-items:center;padding:24px;color:var(--text);background:transparent;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.card{width:min(100%,760px);text-align:center}.eyebrow{margin:0 0 10px;color:var(--accent);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
h1{margin:0;font-size:clamp(20px,4vw,28px);line-height:1.25;font-weight:650}.date{margin:9px 0 28px;color:var(--muted);font-size:14px}
.timer{display:grid;grid-template-columns:repeat(4,1fr);align-items:center}.unit{position:relative;padding:4px 12px}.unit:not(:last-child)::after{position:absolute;top:8px;right:0;bottom:8px;width:1px;background:var(--line);content:""}
.number{display:block;font-size:clamp(32px,7vw,50px);line-height:1;font-weight:650;letter-spacing:-.045em;font-variant-numeric:tabular-nums}.label{display:block;margin-top:10px;color:var(--muted);font-size:10px;letter-spacing:.14em;text-transform:uppercase}.note{margin:28px 0 0;color:var(--muted);font-size:12px}
@media(max-width:440px){body{padding:18px 10px}.unit{padding:4px 6px}.label{font-size:9px;letter-spacing:.09em}.date{margin-bottom:22px}}
</style>
</head>
<body><main class="card">
<p class="eyebrow">Research project checkpoint</p>
<h1>Blue Whale Call Detection Under Ocean Noise</h1>
<p class="date">October 22, 2026 · 9:44 PM Pacific Time</p>
<div class="timer" role="timer" aria-label="Time remaining until the project checkpoint">
<div class="unit"><span class="number" id="days">—</span><span class="label">Days</span></div>
<div class="unit"><span class="number" id="hours">—</span><span class="label">Hours</span></div>
<div class="unit"><span class="number" id="minutes">—</span><span class="label">Minutes</span></div>
<div class="unit"><span class="number" id="seconds">—</span><span class="label">Seconds</span></div>
</div>
<p class="note" id="status">A two-week countdown for the next project checkpoint.</p>
</main>
<script>
// Exactly two weeks after the requested start time; Pacific Daylight Time (UTC−7).
const target=new Date("2026-10-22T21:44:54-07:00").getTime();
const ids=["days","hours","minutes","seconds"],status=document.getElementById("status");
function render(){const left=Math.max(0,target-Date.now()),v=[Math.floor(left/86400000),Math.floor(left/3600000)%24,Math.floor(left/60000)%60,Math.floor(left/1000)%60];ids.forEach((id,i)=>document.getElementById(id).textContent=String(v[i]).padStart(2,"0"));if(!left)status.textContent="The project checkpoint time has arrived."}
render();window.setInterval(render,1000);
</script></body></html>
