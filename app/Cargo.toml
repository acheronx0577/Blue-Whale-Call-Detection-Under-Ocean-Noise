[package]
name = "whale-mix"
version = "0.1.0"
edition = "2021"
description = "Window for the Blue A and Laya mix. Builds on Windows and Mac."
license = "MIT"

[dependencies]
csv = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = "0.29"
rfd = "0.15"

[lib]
path = "src/lib.rs"

[[bin]]
name = "whale-mix"
path = "src/main.rs"
